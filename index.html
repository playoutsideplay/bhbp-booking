<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Black Horse</title>
  <!-- Mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Reset & center */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    bt-booking-widget {
      display: block;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Responsive grid layout for the booking form */
    bt-booking-widget form {
      display: grid !important;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) !important;
      gap: 1rem !important;
      padding: 1rem 0 !important;
    }
    bt-booking-widget form button,
    bt-booking-widget form input[type="submit"] {
      grid-column: 1 / -1 !important;
    }
    @media (max-width: 600px) {
      bt-booking-widget form {
        grid-template-columns: 1fr !important;
      }
    }

  </style>

  <!-- Web Components polyfill if needed -->
  <script src="https://unpkg.com/@webcomponents/webcomponentsjs@2.6.0/webcomponents-bundle.js"></script>
</head>
<body>
  <bt-booking-widget></bt-booking-widget>
  <script src="https://ordertab.menu/blackhorsepelham/widget" type="text/javascript"></script>
</body>
</html>
